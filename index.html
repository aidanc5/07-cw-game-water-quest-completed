<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <style>
    @font-face {
      font-family: 'Proxima Nova';
      src: url('Proxima Nova Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Water Quest</h1>
    <p class="game-instructions">Collect 20 items to complete the game!</p>
    <div class="stats">
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
    </div>
    <div id="achievements" class="achievement"></div>
    <div class="game-grid"></div>
    <div class="difficulty-controls">
      <label for="difficulty-select">Difficulty:</label>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="button-row">
      <button id="start-game">Start Game</button>
      <button id="reset-game" class="reset-button">Reset</button>
    </div>
    <footer class="site-footer">
      <a href="https://www.charitywater.org" target="_blank" rel="noopener noreferrer">Visit charity: water!</a>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
